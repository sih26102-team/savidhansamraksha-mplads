# ==============================================================================
# Render.com Infrastructure Blueprint
# ==============================================================================
services:
  # 1. Express API Backend Service
  - type: web
    name: savidhan-api-server
    env: node
    plan: standard
    buildCommand: pnpm install && pnpm --filter @workspace/backend-data run build
    startCommand: node --enable-source-maps ./backend-data/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: savidhan-postgres-db
          property: connectionString

  # 2. React 19 Frontend Web Service
  - type: web
    name: savidhan-dashboard
    env: static
    buildCommand: pnpm install && pnpm --filter @workspace/frontend-dashboard run build
    staticPublishPath: ./frontend-dashboard/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: savidhan-postgres-db
    databaseName: savidhan
    user: postgres
    plan: standard
