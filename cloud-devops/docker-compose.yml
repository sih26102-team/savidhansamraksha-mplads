services:
  # ============================================================================
  # 1. PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: savidhan-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: savidhan_secure_password
      POSTGRES_DB: savidhan
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d savidhan"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Backend Data Express API Service
  # ============================================================================
  api-server:
    build:
      context: .
      dockerfile: cloud-devops/docker/Dockerfile.api
    container_name: savidhan-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:savidhan_secure_password@postgres:5432/savidhan
      SESSION_SECRET: civicshield-production-super-secret-key-32chars
      NODE_ENV: production
    ports:
      - "5000:5000"

  # ============================================================================
  # 3. Frontend Dashboard Service (React 19 + Nginx)
  # ============================================================================
  frontend-dashboard:
    build:
      context: .
      dockerfile: cloud-devops/docker/Dockerfile.frontend
    container_name: savidhan-frontend
    restart: always
    depends_on:
      - api-server
    ports:
      - "80:80"

volumes:
  pgdata:
    driver: local
